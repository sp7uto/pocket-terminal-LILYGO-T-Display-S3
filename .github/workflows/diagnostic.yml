name: Pocket Terminal firmware
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/diagnostic.yml'
      - 'docs/index.html'
      - 'docs/manifest*.json'
      - 'scripts/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hashes.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - run: pio run
      - name: Merge ESP32-S3 flash image
        run: |
          python -m pip install esptool==4.8.1
          BUILD=.pio/build/lilygo-t-display-s3
          BOOTAPP="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -f "$BOOTAPP"
          mkdir -p dist
          python -m esptool --chip esp32s3 merge_bin -o dist/pocket-terminal-v0.3.0.bin --flash_mode keep --flash_size keep --flash_freq keep 0x0 "$BUILD/bootloader.bin" 0x8000 "$BUILD/partitions.bin" 0xe000 "$BOOTAPP" 0x10000 "$BUILD/firmware.bin"
          cp "$BUILD/firmware.bin" dist/pocket-terminal-app-v0.3.0.bin
          cd dist
          sha256sum pocket-terminal-v0.3.0.bin pocket-terminal-app-v0.3.0.bin > SHA256SUMS.txt
      - name: Record exact build checksums
        id: hashes
        run: echo "value=$(sha256sum dist/SHA256SUMS.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: pocket-terminal-v0.3.0
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Assemble installer site
        if: github.ref == 'refs/heads/main'
        run: |
          cp -a docs/. dist/
          cd dist
          sha256sum -c SHA256SUMS.txt
          test -s manifest.json
          test -s index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public firmware matches deployed build
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.build.outputs.hashes }}
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "${SITE%/}/manifest.json?run=$GITHUB_RUN_ID" -o manifest.json && curl -fsSL --max-time 20 "${SITE%/}/SHA256SUMS.txt?run=$GITHUB_RUN_ID" -o SHA256SUMS.txt && curl -fsSL --max-time 30 "${SITE%/}/pocket-terminal-v0.3.0.bin?run=$GITHUB_RUN_ID" -o pocket-terminal-v0.3.0.bin && curl -fsSL --max-time 30 "${SITE%/}/pocket-terminal-app-v0.3.0.bin?run=$GITHUB_RUN_ID" -o pocket-terminal-app-v0.3.0.bin && python -c 'import json; m=json.load(open("manifest.json")); assert m["version"]=="0.3.0" and m["builds"][0]["parts"]==[{"path":"pocket-terminal-app-v0.3.0.bin","offset":65536}]' && echo "$EXPECTED  SHA256SUMS.txt" | sha256sum -c - && sha256sum -c SHA256SUMS.txt; then
              exit 0
            fi
            sleep 10
          done
          exit 1
