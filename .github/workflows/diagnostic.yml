name: Diagnostic firmware
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - '.github/workflows/diagnostic.yml'
      - 'docs/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - run: pio run
      - name: Merge ESP32-S3 flash image
        run: |
          python -m pip install esptool==4.8.1
          BUILD=.pio/build/lilygo-t-display-s3
          BOOTAPP="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -f "$BOOTAPP"
          mkdir -p dist
          python -m esptool --chip esp32s3 merge_bin -o dist/pocket-terminal-diagnostic-v0.0.1.bin --flash_mode keep --flash_size keep --flash_freq keep 0x0 "$BUILD/bootloader.bin" 0x8000 "$BUILD/partitions.bin" 0xe000 "$BOOTAPP" 0x10000 "$BUILD/firmware.bin"
          cd dist
          sha256sum pocket-terminal-diagnostic-v0.0.1.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-terminal-diagnostic-v0.0.1
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Assemble installer site
        if: github.ref == 'refs/heads/main'
        run: |
          cp -a docs/. dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
